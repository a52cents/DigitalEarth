<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Earth - Live</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- canvas -->
    <div id="canvas-container"></div>

    <!-- NOUVEAU : Overlay cinématographique (Vignette + Scanlines) -->
    <div id="cinematic-overlay">
        <div class="scanlines"></div>
    </div>

    <!-- NOUVEAU : Flash "obturateur" au moment de la capture -->
    <div id="shutter-flash"></div>

    <!-- hud -->
    <div id="hud">
        <!-- clock -->
        <div id="clock" class="hud-element">--:--:-- UTC</div>

        <!-- NOUVEAU : Event Log Feed (Terminal) -->
        <div id="event-log" class="hud-element">
            <div class="log-header">SYSTEM LOG // LIVE FEED</div>
            <div id="log-content"></div>
        </div>

        <!-- theme selector -->
        <div id="theme-selector" class="hud-element">
            <button data-theme="dark" class="active">Dark</button>
            <button data-theme="real">Real</button>
            <button data-theme="wire">Wire</button>
        </div>

        <!-- legend -->
        <div id="legend" class="hud-element">
            <div><span class="dot pulse-dot"></span> Séismes (USGS)</div>
            <div><span class="dot disaster-dot"></span> Alertes (ONU/GDACS)</div>
            <div><span class="dot traffic-dot"></span> Trafic aérien (OpenSky)</div>
        </div>

        <!-- Panneau de Paramètres -->
        <div id="settings-panel" class="hud-element">
            <div class="settings-row">
                <div class="toggle-group">
                    <label class="switch">
                        <input type="checkbox" id="toggle-earthquakes" checked>
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-text">Séismes</span>
                </div>

                <div class="toggle-group">
                    <label class="switch">
                        <input type="checkbox" id="toggle-disasters" checked>
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-text">Alertes</span>
                </div>

                <div class="toggle-group">
                    <label class="switch">
                        <input type="checkbox" id="toggle-airtraffic" checked>
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-text">Avions</span>
                </div>
            </div>

            <div class="settings-divider"></div>

            <div class="settings-row">
                <div class="toggle-group">
                    <label class="switch">
                        <input type="checkbox" id="toggle-autorotate" checked>
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-text">Rotation Auto</span>
                </div>

                <div class="slider-group">
                    <span class="toggle-text">Vitesse</span>
                    <input type="range" id="rotation-speed" min="0" max="2" step="0.1" value="0.5" class="range-slider">
                </div>
            </div>
        </div>
        <!-- NOUVEAU : Bouton de capture cinématique -->
        <button id="capture-btn" class="hud-element" title="Capturer la vue actuelle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8h2.5L8 5.5h8L17.5 8H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" />
                <circle cx="12" cy="13" r="3.5" />
            </svg>
        </button>
    </div>

    <div id="tooltip"></div>

    <script type="module" src="/main.js"></script>
</body>
</html>
